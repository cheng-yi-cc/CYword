name: Publish signed Android release to website

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Android release tag (android-v0.1.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-android
  cancel-in-progress: false

jobs:
  publish:
    if: startsWith(github.event.release.tag_name || inputs.tag, 'android-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Install release validation dependencies
        run: npm ci --ignore-scripts
      - name: Download signed APK from GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          VERSION=$(node -p "require('./android/version.json').versionName")
          test "$RELEASE_TAG" = "android-v$VERSION"
          gh release download "$RELEASE_TAG" --pattern "CYword-Android-$VERSION.apk" --dir release
      - name: Publish APK and update Android pointer
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: node scripts/publish-site-release.mjs release --android
