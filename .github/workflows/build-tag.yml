name: Build Windows installer from tag

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Verify tag matches package version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $packageVersion = node -p "require('./package.json').version"
          $expectedTag = "v$packageVersion"
          if ($env:RELEASE_TAG -ne $expectedTag) {
            throw "Tag $env:RELEASE_TAG does not match package version $packageVersion (expected $expectedTag)."
          }

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build NSIS installer
        run: npm run dist

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $installers = @(Get-ChildItem -LiteralPath release -Filter "CYword-Setup-*.exe" -File)
          if ($installers.Count -ne 1) {
            throw "Expected exactly one Windows installer, found $($installers.Count)."
          }

          $metadata = @(Get-ChildItem -LiteralPath release -Filter "latest.yml" -File)
          if ($metadata.Count -ne 1) {
            throw "Expected exactly one updater metadata file, found $($metadata.Count)."
          }
          $blockmaps = @(Get-ChildItem -LiteralPath release -Filter "CYword-Setup-*.exe.blockmap" -File)
          if ($blockmaps.Count -ne 1) {
            throw "Expected exactly one updater blockmap, found $($blockmaps.Count)."
          }

          $releaseAssets = @($installers[0].FullName, $metadata[0].FullName, $blockmaps[0].FullName)
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG $releaseAssets --repo $env:GITHUB_REPOSITORY --clobber
          } else {
            gh release create $env:RELEASE_TAG $releaseAssets `
              --repo $env:GITHUB_REPOSITORY `
              --verify-tag `
              --title "CYword $env:RELEASE_TAG" `
              --generate-notes
          }

          if ($LASTEXITCODE -ne 0) {
            throw "GitHub Release publishing failed."
          }
