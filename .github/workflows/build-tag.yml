name: Build or publish Windows installer

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Verify tag matches package version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $packageVersion = node -p "require('./package.json').version"
          $expectedTag = "v$packageVersion"
          if ($env:RELEASE_TAG -ne $expectedTag) {
            throw "Tag $env:RELEASE_TAG does not match package version $packageVersion (expected $expectedTag)."
          }

      - name: Install dependencies
        run: npm ci

      - name: Check for an existing GitHub Release
        id: published
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json"; "X-GitHub-Api-Version" = "2026-03-10" }
          $tag = [Uri]::EscapeDataString($env:RELEASE_TAG)
          $response = Invoke-WebRequest -Uri "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/releases/tags/$tag" -Headers $headers -SkipHttpErrorCheck
          if ($response.StatusCode -eq 404) {
            "exists=false" >> $env:GITHUB_OUTPUT
          } elseif ($response.StatusCode -eq 200) {
            $published = $response.Content | ConvertFrom-Json
            if ($published.tag_name -cne $env:RELEASE_TAG -or $published.draft) {
              throw "The existing release must be published and match the requested tag."
            }
            $version = node -p "require('./package.json').version"
            $requiredAssets = @("CYword-Setup-$version.exe", "CYword-Setup-$version.exe.blockmap", "latest.yml")
            foreach ($name in $requiredAssets) {
              $asset = @($published.assets | Where-Object { $_.name -ceq $name })
              if ($asset.Count -ne 1 -or $asset[0].state -ne "uploaded" -or $asset[0].size -le 0) {
                throw "Existing release asset is missing or incomplete: $name. Published assets will not be overwritten."
              }
            }
            "exists=true" >> $env:GITHUB_OUTPUT
          } else {
            throw "GitHub Release lookup failed with HTTP $($response.StatusCode); refusing to treat it as a missing release."
          }

      - name: Run tests
        if: steps.published.outputs.exists == 'false'
        run: npm test

      - name: Build NSIS installer
        if: steps.published.outputs.exists == 'false'
        run: npm run dist

      - name: Restore published release assets
        if: steps.published.outputs.exists == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # 重跑沿用首次发布的原件，避免重建产生新的 releaseDate 或安装包字节。
          $version = node -p "require('./package.json').version"
          New-Item -ItemType Directory -Path release -Force | Out-Null
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --dir release `
            --pattern "CYword-Setup-$version.exe" --pattern "CYword-Setup-$version.exe.blockmap" --pattern "latest.yml"
          if ($LASTEXITCODE -ne 0) { throw "Failed to restore the published release assets." }

      - name: Verify installer and updater metadata
        run: npm run publish:site:release -- release --prepare-only

      - name: Publish GitHub Release
        if: steps.published.outputs.exists == 'false'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $installers = @(Get-ChildItem -LiteralPath release -Filter "CYword-Setup-*.exe" -File)
          if ($installers.Count -ne 1) {
            throw "Expected exactly one Windows installer, found $($installers.Count)."
          }

          $metadata = @(Get-ChildItem -LiteralPath release -Filter "latest.yml" -File)
          if ($metadata.Count -ne 1) {
            throw "Expected exactly one updater metadata file, found $($metadata.Count)."
          }
          $blockmaps = @(Get-ChildItem -LiteralPath release -Filter "CYword-Setup-*.exe.blockmap" -File)
          if ($blockmaps.Count -ne 1) {
            throw "Expected exactly one updater blockmap, found $($blockmaps.Count)."
          }

          $releaseAssets = @($installers[0].FullName, $metadata[0].FullName, $blockmaps[0].FullName)
          gh release create $env:RELEASE_TAG $releaseAssets `
            --repo $env:GITHUB_REPOSITORY `
            --verify-tag `
            --title "CYword $env:RELEASE_TAG" `
            --generate-notes

          if ($LASTEXITCODE -ne 0) {
            throw "GitHub Release publishing failed."
          }

      - name: Publish website release to Cloudflare R2
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: npm run publish:site:release -- release
